components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Individual staff session token issued by POST /sessions (REQ-F-001, REQ-NF-002)

  parameters:
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Validation error on request parameters or body (record remains unchanged)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              value:
                code: "VALIDATION_ERROR"
                message: "Missing or invalid required field"
                details:
                  field: "phone"
    Unauthorized:
      description: Missing, invalid, or revoked staff session token (BDD-017, REQ-F-001)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              summary: BDD-017 visitor without staff sign-in is denied
              value:
                code: "UNAUTHENTICATED"
                message: "Staff sign-in is required"
    Forbidden:
      description: Signed-in staff member lacks role permission for this operation (REQ-F-002, REQ-NF-002)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            roleForbidden:
              value:
                code: "FORBIDDEN"
                message: "Role is not authorized to perform this action"
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                code: "NOT_FOUND"
                message: "Requested record does not exist"
    Conflict:
      description: Uniqueness conflict or domain lifecycle/pricing guard violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            guardViolation:
              value:
                code: "GUARD_VIOLATION"
                message: "Operation violates domain lifecycle or settlement guard"

  schemas:
    Role:
      type: string
      enum: [Receptionist, Technician, Administrator]

    LoyaltyTier:
      type: string
      enum: [Standard, Silver, Gold]

    DeviceType:
      type: string
      enum: [Desktop, Laptop, Server]

    OrderStatus:
      type: string
      enum: [Received, Diagnosing, InProgress, Ready, Completed, Cancelled]

    DecisionType:
      type: string
      enum: [Approved, Declined]

    AuditRecordType:
      type: string
      enum: [StaffAccount, Client, Device, RepairOrder]

    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_ERROR
        - NOT_FOUND
        - CONFLICT
        - GUARD_VIOLATION

    ErrorResponse:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties: true

    SessionCreateRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    SessionResponse:
      type: object
      required: [token, staff]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
        staff:
          $ref: '#/components/schemas/StaffAccount'

    StaffAccount:
      type: object
      required: [id, username, role, enabled]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        username:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/Role'
        enabled:
          type: boolean

    StaffCreateRequest:
      type: object
      required: [username, password, role]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/Role'

    StaffUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
        enabled:
          type: boolean

    Client:
      type: object
      required: [id, name, phone, loyalty_tier]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        name:
