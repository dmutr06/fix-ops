openapi: 3.0.3
info:
  title: FixOps Workshop API
  version: 1.0.2
  description: >
    Internal REST API contract for the FixOps PC and electronics repair workshop
    (SRS 1.0.2, ADD-001, ADD-002). Monetary amounts are represented in whole USD
    cents (`*_cents`).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://127.0.0.1:4010
    description: Local Mock / Development API Server

tags:
  - name: Sessions
    description: Staff authentication (REQ-F-001, REQ-F-019, REQ-NF-002)
  - name: Staff
    description: Staff account management by Administrator (REQ-F-019, REQ-F-002)
  - name: Clients
    description: Client records, search, and loyalty tiers (REQ-F-003, REQ-F-017, REQ-NF-001)
  - name: Devices
    description: Serviced device records and search (REQ-F-004, REQ-NF-001)
  - name: RepairOrders
    description: Repair order intake, diagnosis, estimate, repair, settlement, and corrections (REQ-F-005–REQ-F-018)
  - name: AuditLogs
    description: Change audit log retrieval (REQ-F-018, REQ-NF-003)

security:
  - bearerAuth: []

paths:
  /api/v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Sign in with an active staff account
      security: []
      x-requirements: [REQ-F-001, REQ-F-019, REQ-NF-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
            examples:
              validSignIn:
                summary: Receptionist sign-in
                value:
                  username: "anna.recep"
                  password: "correct-horse-battery-staple"
      responses:
        '201':
          description: Signed-in staff session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                signedIn:
                  value:
                    token: "sess_recep_01"
                    staff:
                      id: 1
                      username: "anna.recep"
                      role: "Receptionist"
                      enabled: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or password (REQ-F-001)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value:
                    code: "UNAUTHENTICATED"
                    message: "Invalid username or password"
        '403':
          description: Account is disabled (REQ-F-019)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                disabledAccount:
                  value:
                    code: "FORBIDDEN"
                    message: "Staff account is disabled"
                    details:
                      username: "disabled.user"

  /api/v1/staff:
    get:
      tags: [Staff]
      operationId: listStaffAccounts
      summary: List staff accounts
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-019, REQ-NF-002]
      x-roles: [Administrator]
      responses:
        '200':
          description: List of staff accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAccount'
              examples:
                staffList:
                  value:
                    - id: 1
                      username: "anna.recep"
                      role: "Receptionist"
                      enabled: true
                    - id: 2
                      username: "max.tech"
                      role: "Technician"
                      enabled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Staff]
      operationId: createStaffAccount
      summary: Create an individual staff account with an assigned role
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-019, REQ-NF-002, REQ-NF-003]
      x-roles: [Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreateRequest'
            examples:
              createTechnician:
                value:
                  username: "max.tech"
                  password: "initial-password-123"
                  role: "Technician"
      responses:
        '201':
          description: Staff account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
              examples:
                createdTech:
                  value:
                    id: 2
                    username: "max.tech"
                    role: "Technician"
                    enabled: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate staff username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateUsername:
                  value:
                    code: "CONFLICT"
                    message: "username already exists"
                    details:
                      username: "max.tech"

  /api/v1/staff/{staffId}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    patch:
      tags: [Staff]
      operationId: updateStaffAccount
      summary: Update staff role or enable/disable account
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-019, REQ-NF-002, REQ-NF-003]
      x-roles: [Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdateRequest'
            examples:
              disableStaff:
                value:
                  enabled: false
      responses:
        '200':
          description: Updated staff account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
              examples:
                disabledTech:
                  value:
                    id: 2
                    username: "max.tech"
                    role: "Technician"
                    enabled: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/clients:
    get:
      tags: [Clients]
      operationId: listClients
      summary: Search or list client records
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-003, REQ-NF-001, REQ-NF-002]
      x-roles: [Receptionist, Technician, Administrator]
      parameters:
        - name: q
          in: query
          required: false
          description: Optional case-insensitive filter on client name or phone
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Matching client records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
              examples:
                clientList:
                  value:
                    - id: 10
                      name: "Bob Vance"
                      phone: "+1-555-0100"
                      email: "bob@vance.org"
                      loyalty_tier: "Standard"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Clients]
      operationId: createClient
      summary: Create a client record with name, phone, and optional email
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-003, REQ-NF-002, REQ-NF-003]
      x-roles: [Receptionist, Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateRequest'
            examples:
              validClient:
                summary: BDD-001 valid client
                value:
                  name: "Bob Vance"
                  phone: "+1-555-0100"
                  email: "bob@vance.org"
      responses:
        '201':
          description: Client record created with Standard loyalty tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              examples:
                createdClient:
                  value:
                    id: 10
                    name: "Bob Vance"
                    phone: "+1-555-0100"
                    email: "bob@vance.org"
                    loyalty_tier: "Standard"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Clients]
      operationId: getClient
      summary: Retrieve a client record
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-003, REQ-NF-001, REQ-NF-002]
      x-roles: [Receptionist, Technician, Administrator]
      responses:
        '200':
          description: Client record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              examples:
                existingClient:
                  value:
                    id: 10
                    name: "Bob Vance"
                    phone: "+1-555-0100"
                    email: "bob@vance.org"
                    loyalty_tier: "Standard"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Clients]
      operationId: updateClient
      summary: Update client name, phone, or optional email
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-003, REQ-NF-002, REQ-NF-003]
      x-roles: [Receptionist, Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdateRequest'
            examples:
              updatePhone:
                value:
                  phone: "+1-555-0199"
      responses:
        '200':
          description: Updated client record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              examples:
                updatedClient:
                  value:
                    id: 10
                    name: "Bob Vance"
                    phone: "+1-555-0199"
                    email: "bob@vance.org"
                    loyalty_tier: "Standard"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/clients/{clientId}/loyalty-tier:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    put:
      tags: [Clients]
      operationId: setClientLoyaltyTier
      summary: Set a client's loyalty tier manually (Administrator only)
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-016, REQ-F-017, REQ-NF-002, REQ-NF-003]
      x-roles: [Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoyaltyTierUpdateRequest'
            examples:
              promoteToGold:
                summary: BDD-015 promote client to Gold
                value:
                  loyalty_tier: "Gold"
      responses:
        '200':
          description: Client with updated loyalty tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              examples:
                goldClient:
                  value:
                    id: 10
                    name: "Bob Vance"
                    phone: "+1-555-0100"
                    email: "bob@vance.org"
                    loyalty_tier: "Gold"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Non-administrator role denied (BDD-011)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                technicianDenied:
                  summary: BDD-011 Technician denied loyalty tier change
                  value:
                    code: "FORBIDDEN"
                    message: "Only Administrator may change a client's loyalty tier"
                    details:
                      required_role: "Administrator"
                      actual_role: "Technician"
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: Search or list device records
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-004, REQ-NF-001, REQ-NF-002]
      x-roles: [Receptionist, Technician, Administrator]
      parameters:
        - name: client_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: q
          in: query
          required: false
          description: Optional filter on serial number
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Matching device records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
              examples:
                deviceList:
                  value:
                    - id: 20
                      client_id: 10
                      device_type: "Laptop"
                      serial_number: "SN-THINKPAD-9001"
                      reported_symptoms: "No power on AC adapter"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Devices]
      operationId: createDevice
      summary: Create a serviced device linked to a client
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-004, REQ-NF-002, REQ-NF-003]
      x-roles: [Receptionist, Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
            examples:
              validDevice:
                summary: BDD-001 valid laptop device
                value:
                  client_id: 10
                  device_type: "Laptop"
                  serial_number: "SN-THINKPAD-9001"
                  reported_symptoms: "No power on AC adapter"
      responses:
        '201':
          description: Device record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                createdDevice:
                  value:
                    id: 20
                    client_id: 10
                    device_type: "Laptop"
                    serial_number: "SN-THINKPAD-9001"
                    reported_symptoms: "No power on AC adapter"
        '400':
          description: Missing required device fields (BDD-002)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSerialNumber:
                  summary: BDD-002 device without serial number
                  value:
                    code: "VALIDATION_ERROR"
                    message: "serial_number is required and cannot be empty"
                    details:
                      field: "serial_number"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDevice
      summary: Retrieve a device record
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-004, REQ-NF-001, REQ-NF-002]
      x-roles: [Receptionist, Technician, Administrator]
      responses:
        '200':
          description: Device record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                existingDevice:
                  value:
                    id: 20
                    client_id: 10
                    device_type: "Laptop"
                    serial_number: "SN-THINKPAD-9001"
                    reported_symptoms: "No power on AC adapter"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Devices]
      operationId: updateDevice
      summary: Update device type, serial number, or reported symptoms
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-004, REQ-NF-002, REQ-NF-003]
      x-roles: [Receptionist, Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
            examples:
              updateSymptoms:
                value:
                  reported_symptoms: "No power on AC adapter; battery LED blinks 3x"
      responses:
        '200':
          description: Updated device record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                updatedDevice:
                  value:
                    id: 20
                    client_id: 10
                    device_type: "Laptop"
                    serial_number: "SN-THINKPAD-9001"
                    reported_symptoms: "No power on AC adapter; battery LED blinks 3x"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orders:
    get:
      tags: [RepairOrders]
      operationId: listRepairOrders
      summary: List or filter repair orders
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-005, REQ-F-015, REQ-F-016, REQ-NF-001, REQ-NF-002]
      x-roles: [Receptionist, Technician, Administrator]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: client_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: ticket_number
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Matching repair orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepairOrder'
              examples:
                orderList:
                  value:
                    - id: 100
                      ticket_number: "FIX-2026-0001"
                      client_id: 10
                      device_id: 20
                      assigned_technician_id: 2
                      status: "Received"
                      diagnostic_findings: null
                      estimate: null
                      client_decision: null
                      used_parts_cents: 0
                      completed_labor_cents: 0
                      repair_checked: false
                      labor_discount_cents: 0
                      settlement_cents: 0
                      payment: null
                      pickup: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [RepairOrders]
      operationId: createRepairOrder
      summary: Create a repair order in Received state
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-005, REQ-NF-001, REQ-NF-002, REQ-NF-003]
      x-roles: [Receptionist, Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairOrderCreateRequest'
            examples:
              validIntake:
                summary: BDD-001 valid order intake
                value:
                  ticket_number: "FIX-2026-0001"
                  client_id: 10
                  device_id: 20
                  assigned_technician_id: 2
      responses:
        '201':
          description: RepairOrder created in Received state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairOrder'
              examples:
                receivedOrder:
                  value:
                    id: 100
                    ticket_number: "FIX-2026-0001"
                    client_id: 10
                    device_id: 20
                    assigned_technician_id: 2
                    status: "Received"
                    diagnostic_findings: null
                    estimate: null
                    client_decision: null
                    used_parts_cents: 0
                    completed_labor_cents: 0
                    repair_checked: false
                    labor_discount_cents: 0
                    settlement_cents: 0
                    payment: null
                    pickup: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate ticket number or invalid device/technician relationship (BDD-002)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateTicket:
                  summary: BDD-002 duplicate ticket number rejected
                  value:
                    code: "CONFLICT"
                    message: "ticket_number already exists"
                    details:
                      ticket_number: "FIX-2026-0001"

  /api/v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [RepairOrders]
      operationId: getRepairOrder
      summary: Retrieve a repair order with current settlement calculation
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-005, REQ-F-015, REQ-F-016, REQ-NF-001, REQ-NF-002]
      x-roles: [Receptionist, Technician, Administrator]
      responses:
        '200':
          description: RepairOrder details and calculated settlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairOrder'
              examples:
                openOrder:
                  value:
                    id: 100
                    ticket_number: "FIX-2026-0001"
                    client_id: 10
                    device_id: 20
                    assigned_technician_id: 2
                    status: "Received"
                    diagnostic_findings: null
                    estimate: null
                    client_decision: null
                    used_parts_cents: 0
                    completed_labor_cents: 0
                    repair_checked: false
                    labor_discount_cents: 0
                    settlement_cents: 0
                    payment: null
                    pickup: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [RepairOrders]
      operationId: correctRepairOrder
      summary: Administrator correction of any RepairOrder field preserving business rules and audit
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-014, REQ-F-015, REQ-F-016, REQ-F-018, REQ-NF-002, REQ-NF-003]
      x-roles: [Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairOrderCorrectionRequest'
            examples:
              correctLaborCost:
                summary: BDD-016 Administrator corrects completed labor charge
                value:
                  completed_labor_cents: 8000
      responses:
        '200':
          description: Corrected RepairOrder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairOrder'
              examples:
                correctedOrder:
                  value:
                    id: 100
                    ticket_number: "FIX-2026-0001"
                    client_id: 10
                    device_id: 20
                    assigned_technician_id: 2
                    status: "Ready"
                    diagnostic_findings: "Faulty USB-C power controller IC on mainboard"
                    estimate:
                      parts_cents: 10000
                      labor_cents: 10000
                    client_decision:
                      decision: "Approved"
                      decided_at: "2026-10-21T10:15:00Z"
                    used_parts_cents: 10000
                    completed_labor_cents: 8000
                    repair_checked: true
                    labor_discount_cents: 800
                    settlement_cents: 17200
                    payment: null
                    pickup: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Correction violates lifecycle, uniqueness, or guard constraints (REQ-F-018)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reopenTerminalDenied:
                  value:
                    code: "GUARD_VIOLATION"
                    message: "Terminal orders (Completed or Cancelled) cannot be reopened"
                    details:
                      current_status: "Completed"
                      requested_status: "InProgress"

  /api/v1/orders/{orderId}/diagnosis:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    put:
      tags: [RepairOrders]
      operationId: recordDiagnosis
      summary: Move order from Received to Diagnosing and optionally save diagnostic findings
      x-requirements: [REQ-F-001, REQ-F-002, REQ-F-006, REQ-F-014, REQ-NF-002, REQ-NF-003]
      x-roles: [Technician, Administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosisRequest'
            examples:
              saveFindings:
                value:
