services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fixops
      POSTGRES_PASSWORD: fixops
      POSTGRES_DB: fixops
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixops -d fixops"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
